{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Chemical House: Daily Stock Entry</h2>
        <!-- NEW DASHBOARD BUTTON -->
        <a href="/chemical/dashboard" class="btn btn-outline-secondary">📊 Master Dashboard</a>
    </div>
    <hr>
    
    <div id="alertBox" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm p-4">
        <form id="bulkOperatorForm">
            <div class="table-responsive">
                <table class="table table-hover align-middle text-center">
                    <thead class="table-dark">
                        <tr>
                            <th>Chemical</th>
                            <th>Previous Stock</th>
                            <th>Current Stock (Enter Value)</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for chem in chemicals %}
                        <tr>
                            <td class="fw-bold fs-5">{{ chem.name }}</td>
                            <td class="text-muted fs-5">{{ chem.last_stock }}</td>
                            <td>
                                <input type="number" step="0.01" class="form-control form-control-lg text-center chem-input" 
                                       data-name="{{ chem.name }}" placeholder="Enter current stock">
                            </td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-muted">No chemicals configured yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn btn-success btn-lg w-100 mt-3">Submit All Entries</button>
        </form>
    </div>
</div>

<script>
document.getElementById('bulkOperatorForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    const entries = [];
    document.querySelectorAll('.chem-input').forEach(input => {
        if(input.value.trim() !== "") {
            entries.push({
                name: input.getAttribute('data-name'),
                current_stock: input.value
            });
        }
    });

    if(entries.length === 0) {
        alert("Please enter stock for at least one chemical.");
        return;
    }

    fetch('/chemical/api/operator/log_stock_bulk', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ entries: entries })
    })
    .then(response => response.json())
    .then(data => {
        const alertBox = document.getElementById('alertBox');
        alertBox.classList.remove('d-none');
        
        if(data.alerts && data.alerts.length > 0) {
            alertBox.className = "alert alert-warning mt-3 fw-bold";
            alertBox.innerHTML = `⚠️ Stock logged. Low stock alerts triggered for: ${data.alerts.join(', ')}`;
        } else {
            alertBox.className = "alert alert-success mt-3";
            alertBox.innerText = data.message;
        }
        
        setTimeout(() => location.reload(), 2000);
    })
    .catch(error => console.error('Error:', error));
});
</script>
{% endblock %}
