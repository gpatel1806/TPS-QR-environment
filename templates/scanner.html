{% extends "base.html" %}

{% block title %}
Optical QR Scanner | Plant Ops
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0 fw-bold"><i class="bi bi-qr-code-scan me-2"></i>Field Asset Scanner</h5>
                    <span class="small text-white-50">Point optical sensor at equipment tag</span>
                </div>
                <span id="camera-badge" class="badge bg-secondary">Initializing</span>
            </div>

            <div class="card-body text-center p-3">
                <div id="reader-container" class="position-relative mx-auto rounded overflow-hidden" style="max-width: 420px;">
                    <div id="reader" style="width: 100%;"></div>
                </div>

                <div class="mt-3">
                    <div id="scan-status" class="alert alert-secondary small mb-3">
                        <i class="bi bi-camera-video me-1"></i> Requesting camera permissions...
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Directory
                    </a>
                    <button id="restart-btn" class="btn btn-outline-primary btn-sm" style="display: none;" onclick="restartScanner()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Scan Another Tag
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- HTML5 QR Code Engine via CDN -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    let html5QrCode = null;
    let isScanning = false;

    function setStatus(message, bsClass, iconClass) {
        const statusBox = document.getElementById('scan-status');
        statusBox.className = `alert alert-${bsClass} small mb-3`;
        statusBox.innerHTML = `<i class="bi bi-${iconClass} me-1"></i> ${message}`;
    }

    function sanitizeAndResolveTarget(rawText) {
        const text = rawText.trim();

        // Case 1: Scanned direct asset ID, e.g. "EQ-00001"
        if (/^[a-zA-Z0-9_\-]+$/.test(text)) {
            return `/equipment/${encodeURIComponent(text)}`;
        }

        // Case 2: Full URL or relative path
        try {
            const parsedUrl = new URL(text, window.location.origin);
            
            // Security check: Must belong to this plant web app domain
            if (parsedUrl.origin !== window.location.origin) {
                return null;
            }

            // Must navigate to equipment paths
            if (parsedUrl.pathname.startsWith('/equipment/')) {
                return parsedUrl.pathname + parsedUrl.search;
            }
        } catch (e) {
            return null;
        }

        return null;
    }

    function onScanSuccess(decodedText) {
        const validPath = sanitizeAndResolveTarget(decodedText);

        if (!validPath) {
            setStatus(`Unrecognized plant QR code: "${decodedText}". Navigation blocked for security.`, 'warning', 'shield-exclamation');
            document.getElementById('restart-btn').style.display = 'inline-block';
            stopCamera();
            return;
        }

        setStatus(`Asset Tag Detected. Redirecting to <strong>${validPath}</strong>...`, 'success', 'check-circle-fill');
        
        stopCamera().then(() => {
            setTimeout(() => {
                window.location.href = validPath;
            }, 600);
        });
    }

    function stopCamera() {
        if (html5QrCode && isScanning) {
            return html5QrCode.stop().then(() => {
                isScanning = false;
                document.getElementById('camera-badge').className = "badge bg-secondary";
                document.getElementById('camera-badge').textContent = "Camera Standby";
            }).catch(err => {
                console.error("Error stopping camera:", err);
            });
        }
        return Promise.resolve();
    }

    function startScanner() {
        const badge = document.getElementById('camera-badge');
        const restartBtn = document.getElementById('restart-btn');
        restartBtn.style.display = 'none';

        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }

        const config = {
            fps: 15,
            qrbox: { width: 250, height: 250 },
            aspectRatio: 1.0
        };

        // Prefer rear camera on mobile devices
        html5QrCode.start(
            { facingMode: "environment" },
            config,
            onScanSuccess,
            (/* ignore empty frames */) => {}
        ).then(() => {
            isScanning = true;
            badge.className = "badge bg-success";
            badge.textContent = "Camera Active";
            setStatus('Align asset QR code inside the guide box.', 'info', 'viewfinder');
        }).catch(err => {
            badge.className = "badge bg-danger";
            badge.textContent = "Camera Blocked";

            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                setStatus('Camera access requires HTTPS or localhost. Please check server protocol.', 'danger', 'lock-fill');
            } else {
                setStatus(`Camera initialization error: ${err.message || err}. Please check device permissions.`, 'danger', 'exclamation-octagon-fill');
            }
            restartBtn.style.display = 'inline-block';
        });
    }

    function restartScanner() {
        startScanner();
    }

    document.addEventListener("DOMContentLoaded", () => {
        startScanner();
    });

    // Clean up camera stream when user leaves page
    window.addEventListener("beforeunload", () => {
        if (html5QrCode && isScanning) {
            html5QrCode.stop().catch(() => {});
        }
    });
</script>
{% endblock %}
