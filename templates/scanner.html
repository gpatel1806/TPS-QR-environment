{% extends "base.html" %}

{% block title %}
Optical QR Scanner | Plant Ops
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-12">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="mb-0 fw-bold"><i class="bi bi-qr-code-scan me-2"></i>Field Asset Scanner</h5>
                    <span class="small text-white-50">Point optical sensor at equipment tag</span>
                </div>
                <span class="badge bg-success">Camera Ready</span>
            </div>

            <div class="card-body text-center p-3">
                <div id="reader-container" class="position-relative mx-auto rounded overflow-hidden" style="max-width: 420px;">
                    <div id="reader" style="width: 100%;"></div>
                </div>

                <div class="mt-3">
                    <div id="scan-status" class="alert alert-secondary small mb-3">
                        <i class="bi bi-camera-video me-1"></i> Requesting optical permissions...
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="/" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left me-1"></i> Directory
                    </a>
                    <button id="restart-btn" class="btn btn-outline-primary btn-sm" style="display: none;" onclick="startScanner()">
                        <i class="bi bi-arrow-clockwise me-1"></i> Scan Another Tag
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- HTML5 QR Code Engine via CDN -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

<script>
    let html5QrcodeScanner;

    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('scan-status').className = "alert alert-success small mb-3";
        document.getElementById('scan-status').innerHTML = `<i class="bi bi-check-circle-fill me-1"></i> Tag Detected: <strong>${decodedText}</strong>. Redirecting...`;
        
        // Stop scanning after successful read
        html5QrcodeScanner.clear();

        // Redirect immediately if URL matches current origin or navigate directly
        setTimeout(() => {
            window.location.href = decodedText;
        }, 800);
    }

    function onScanFailure(error) {
        // Continuous scanning state - no need to log every empty frame
    }

    function startScanner() {
        document.getElementById('scan-status').className = "alert alert-info small mb-3";
        document.getElementById('scan-status').innerHTML = '<i class="bi bi-viewfinder me-1"></i> Align QR matrix inside guide box';
        document.getElementById('restart-btn').style.display = 'none';

        html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 15, 
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    // Initialize optical engine when DOM loads
    document.addEventListener("DOMContentLoaded", () => {
        startScanner();
    });
</script>
{% endblock %}
