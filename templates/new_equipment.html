{% extends "base.html" %}

{% block title %}
Commission New Asset | Plant Ops
{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-12">
        <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0 fw-bold"><i class="bi bi-plus-circle me-2"></i>Commission New Equipment</h5>
                <span class="small text-white-50">Register an asset into the active plant database</span>
            </div>

            <div class="card-body p-4">
                {% if error_message %}
                <div class="alert alert-danger d-flex align-items-center mb-3">
                    <i class="bi bi-exclamation-octagon-fill fs-4 me-2"></i>
                    <div>{{ error_message }}</div>
                </div>
                {% endif %}

               <form method="POST" action="/equipment/new">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Equipment ID</label>
                            <input type="text" name="id" class="form-control" placeholder="e.g. EQ-00005" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Tag No</label>
                            <input type="text" name="tag" class="form-control" placeholder="e.g. 33kV-BUS-COUPLER" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Equipment Type</label>
                            <input type="text" name="equipment_type" class="form-control" placeholder="e.g. transformer, pump, breaker" required>
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Name</label>
                            <input type="text" name="name" class="form-control" placeholder="e.g. Bus Coupler VCB Panel" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Area</label>
                            <input type="text" name="area" class="form-control" placeholder="e.g. Switchgear Room" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Rating / Capacity</label>
                            <input type="text" name="rating" class="form-control" placeholder="e.g. 1500 kVA or 630 kW">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Substation (If applicable)</label>
                            <input type="text" name="substation" class="form-control" placeholder="e.g. Substation A">
                        </div>
                        
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-secondary">Feeder (If applicable)</label>
                            <input type="text" name="feeder" class="form-control" placeholder="e.g. Incomer 1">
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold small text-secondary">Additional Information</label>
                            <textarea name="specs" class="form-control" rows="2" placeholder="Manufacturer, serial number, or extra specs..."></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold small text-secondary">Initial Operational Status</label>
                            <select name="status" class="form-select" required>
                                <option value="In Service">In Service</option>
                                <option value="Standby">Standby</option>
                                <option value="Under Maintenance">Under Maintenance</option>
                                <option value="Breakdown">Breakdown</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                        <a href="/" class="btn btn-outline-secondary btn-sm">Cancel</a>
                        <button type="submit" class="btn btn-primary fw-semibold px-4">
                            <i class="bi bi-check2-circle me-1"></i> Register Asset
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
