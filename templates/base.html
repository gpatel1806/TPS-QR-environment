<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Plant Equipment System{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons via CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Industrial Top Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-uppercase d-flex align-items-center" href="/">
                <i class="bi bi-lightning-charge-fill text-warning me-2"></i>
                Plant Asset Ops
                <span class="badge bg-secondary ms-2 fs-6">Substation A</span>
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="/"><i class="bi bi-card-list me-1"></i> Asset Directory</a>
                <a class="nav-link text-light opacity-75" href="/health"><i class="bi bi-heart-pulse me-1"></i> Health</a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container my-4 flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Industrial Footer -->
    <footer class="bg-white border-top text-center py-3 text-muted small">
        <div class="container">
            <i class="bi bi-qr-code me-1"></i> QR Based Industrial Equipment Management System &bull; Active SCADA Web Bridge
        </div>
    </footer>

    <!-- Bootstrap Bundle with Popper (JavaScript for interactive components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
